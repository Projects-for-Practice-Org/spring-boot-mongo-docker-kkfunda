apiVersion: v1
kind: ConfigMap
metadata:
  name: springappconfigmap
data:
  username: springapp

---
apiVersion: v1
kind: Secret
metadata:
  name: springappsecrets
type: Opaque
stringData:
  password: devdb123

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-hostpath
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /tmp/mongodata

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-hostpath
spec:
  storageClassName: manual
  volumeName: pv-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
# Spring Boot Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springappdeployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springapp

  template:
    metadata:
      labels:
        app: springapp

    spec:
      imagePullSecrets:
        - name: mysecretdocker

      containers:
        - name: springappcontainer
          image: appajichowdary/springbootapp1:latest

          ports:
            - containerPort: 8080

          env:
            - name: MONGO_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: springappconfigmap
                  key: username

            - name: MONGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: springappsecrets
                  key: password

            - name: MONGO_DB_HOSTNAME
              value: mongo

---
apiVersion: v1
kind: Service
metadata:
  name: springapp
spec:
  type: LoadBalancer

  selector:
    app: springapp

  ports:
    - port: 80
      targetPort: 8080

---
# MongoDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodbdeployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      volumes:
        - name: mongodb-pvc
          persistentVolumeClaim:
            claimName: pvc-hostpath

      containers:
        - name: mongodbcontainer
          image: mongo

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: springappconfigmap
                  key: username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: springappsecrets
                  key: password

          volumeMounts:
            - name: mongodb-pvc
              mountPath: /data/db

---
apiVersion: v1
kind: Service
metadata:
  name: mongo

spec:
  type: ClusterIP

  selector:
    app: mongodb

  ports:
    - port: 27017
      targetPort: 27017
